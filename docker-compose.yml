version: '3.8'

services:
  youtube-shorts-automation:
    build: .
    container_name: why-would-you-automation
    ports:
      - "8000:8000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - DEBUG=False
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./token.pickle:/app/token.pickle
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - youtube-automation-network

  # Optional: Add a reverse proxy with nginx
  nginx:
    image: nginx:alpine
    container_name: youtube-automation-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - youtube-shorts-automation
    restart: unless-stopped
    networks:
      - youtube-automation-network
    profiles:
      - production

networks:
  youtube-automation-network:
    driver: bridge

volumes:
  uploads:
  output: 